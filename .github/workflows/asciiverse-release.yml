# Builds Blightmud for the Asciiverse catalog and as system packages.
#
# For av: one archive per target, named blightmud-<target>.tar.gz, plus a
# SHA256SUMS file, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github").
# For everyone else: .deb, .rpm and Arch packages from the same Linux
# binary, made by nfpm (asciiverse/nfpm.yaml).
#
# Tags look like v5.7.1-av.1: upstream's version, then our packaging
# release. build.rs reads the version from the newest v*.*.* tag, so the
# checkout fetches full history and tags.
#
# Linux is a glibc build on Debian 12 (glibc 2.34 or newer at run time),
# not static: sound goes through the system's libasound, whose plugins
# (PipeWire, PulseAudio) a static ALSA could not load. Upstream has no
# native Windows support (termion), so there is no Windows build.

name: asciiverse-release

on:
  push:
    tags: ["v*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: blightmud
  BIN: blightmud
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, arch: amd64 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Build
        run: |
          docker run --rm -v "$PWD":/src -w /src rust:1-bookworm sh -c '
            apt-get update -qq && apt-get install -y -qq libasound2-dev libclang-dev cmake >/dev/null &&
            git config --global --add safe.directory /src &&
            cargo build --release --locked &&
            strip target/release/blightmud'
          sudo chown -R "$(id -u):$(id -g)" target
          file target/release/$BIN
          ./target/release/$BIN --version || true

      - name: Package for av
        run: |
          # the binary sits at the top of the archive, where av looks for it
          mkdir -p stage dist
          cp target/release/$BIN LICENSE README.md stage/
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - name: System packages
        run: |
          v="${TAG#v}"; export VERSION="${v%%-av.*}" RELEASE="${v##*-av.}" ARCH="${{ matrix.arch }}"
          for p in deb rpm archlinux; do
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
              -e VERSION -e RELEASE -e ARCH goreleaser/nfpm:v2.43.0 \
              package --config asciiverse/nfpm.yaml --packager "$p" --target dist/
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}
          strip target/${{ matrix.target }}/release/$BIN
          otool -L target/${{ matrix.target }}/release/$BIN

      - name: Package
        run: |
          mkdir -p stage dist
          cp target/${{ matrix.target }}/release/$BIN LICENSE README.md stage/
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Blightmud $TAG" \
                 --notes "Blightmud ${TAG%%-av.*} from github.com/Blightmud/Blightmud, built for the Asciiverse catalog, with .deb, .rpm and Arch packages. Changes from upstream: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
