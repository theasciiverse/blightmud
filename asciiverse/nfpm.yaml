# System packages (.deb, .rpm, Arch) for Blightmud, built by nfpm from
# the same Linux binary as the av archive. The release workflow sets
# VERSION, RELEASE (our packaging release) and ARCH (amd64 or arm64), and
# puts the binary at stage/blightmud.
#
# No .desktop file on purpose: av is the one place titles are started from,
# so Asciiverse packages never add menu entries (asciiverse/CLAUDE.md).
#
# Named blightmud-asciiverse so it never collides with upstream's own .deb
# or a distribution package; it installs the same blightmud command.
#
# The binary links the system's libasound (sound), libstdc++ (spellcheck)
# and zlib; everything else is built in. glibc 2.34 or newer, so no Alpine
# package: a glibc build cannot use Alpine's musl libstdc++.
name: blightmud-asciiverse
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: ${RELEASE}
section: net
priority: optional
maintainer: Asciiverse <packages@asciiverse.sh>
vendor: Asciiverse
homepage: https://github.com/theasciiverse/blightmud
license: GPL-3.0-only
conflicts: [blightmud]
provides: [blightmud]
description: |
  Terminal MUD client in Rust with Lua scripting.
  TLS connections checked against Mozilla's root certificates, GMCP and
  MSDP, a screen reader mode, spellcheck and sound.
  Packaged by Asciiverse from github.com/Blightmud/Blightmud.
overrides:
  deb:
    depends: ["libasound2t64 | libasound2", libstdc++6, zlib1g]
  rpm:
    depends: [alsa-lib, libstdc++, zlib]
  archlinux:
    depends: [alsa-lib, gcc-libs, zlib]
contents:
  - src: stage/blightmud
    dst: /usr/bin/blightmud
    file_info:
      mode: 0755
  - src: LICENSE
    dst: /usr/share/doc/blightmud-asciiverse/copyright
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/blightmud-asciiverse/README.md
    file_info:
      mode: 0644
